[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --tb=short
    --strict-markers
    --html=reports/report.html
    --self-contained-html

timeout = 120

markers =
    smoke:        Fast critical path tests — run on every commit
    regression:   Full regression suite — run on every PR
    sanity:       Quick sanity checks after deployment
    e2e:          End-to-end UI tests
    api:          API tests — no browser needed
    visual:       Visual regression tests
    a11y:         Accessibility tests
    critical:     Business-critical tests
    slow:         Tests that take longer than 30 seconds
    skip_ci:      Skip in CI environments

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_date_format = %H:%M:%S
